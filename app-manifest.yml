# GitHub App manifest for Half-Shell.
#
# Register at: https://github.com/settings/apps/new
# (or an organization's Settings → Developer settings → GitHub Apps → New)
#
# Replace HALF_SHELL_URL with the public base URL of the deployed service.
#
# This is a CHECKLIST for filling in that form by hand. GitHub's App-manifest
# flow takes a JSON manifest POSTed from an HTML form, not a YAML file from a
# repository, and Half-Shell implements no manifest-conversion endpoint — so
# there is no automated path that consumes this file.

name: Half-Shell
url: https://github.com/diese-tech/half-shell
description: >-
  Adversarial multi-agent pull request review. The Dojo reviews in specialist
  lanes, spars over anonymous findings, and only findings that survive
  adjudication are published.

hook_attributes:
  url: HALF_SHELL_URL/webhook
  active: true

# No redirect_url: Half-Shell has no endpoint that handles the manifest
# conversion code, so pointing one at the service would send that credential
# to a 404 and into the request logs.
public: false

default_events:
  - pull_request
  - issue_comment
  - pull_request_review_comment

default_permissions:
  # Read the diff and post reviews, inline comments and thread replies.
  pull_requests: write
  # Read changed files, linked tests and repository engineering instructions.
  contents: read
  # Post and read pull request conversation comments.
  issues: write
  # Required for every installation.
  metadata: read
